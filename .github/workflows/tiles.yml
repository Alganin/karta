name: Нарезка старых карт
on:
  push:
    branches: [main]
    paths: ['maps-src/**', 'tools/build_tiles.py', '.github/workflows/tiles.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: tiles
  cancel-in-progress: false
jobs:
  tiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Установить GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin python3-gdal
      - name: Нарезать карты
        run: python3 tools/build_tiles.py
      - name: Сохранить тайлы
        run: |
          git config user.name "tiles-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tiles maps.json
          if git diff --cached --quiet; then echo "Изменений нет"; exit 0; fi
          git commit -q -m "Нарезка старых карт"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
      - name: Обновить сайт
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
